name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  android:
    name: ${{ matrix.flavor }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [MeshlitV1, MeshlitV2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Prepare real pinned starter model
        run: python3 scripts/prepare-bundled-model.py
      - name: Validate feature references
        run: python3 scripts/validate-feature-map.py
      - name: Assemble, unit checks and fatal lint
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: ./gradlew ":app:assemble${FLAVOR}Debug" ":app:test${FLAVOR}DebugUnitTest" ":app:lint${FLAVOR}Debug" :core-observability:testDebugUnitTest :core-inference:testDebugUnitTest :core-mcp:testDebugUnitTest :core-cloud-mcp:testDebugUnitTest :core-net:testDebugUnitTest --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ matrix.flavor }}
          path: |
            app/build/reports/
            core-observability/build/reports/tests/
            core-net/build/reports/tests/
          if-no-files-found: warn
